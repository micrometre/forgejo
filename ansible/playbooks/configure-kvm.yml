---
# =============================================================================
# KVM / Libvirt Host Configuration & VM Lifecycle Playbook
# =============================================================================
# Based on https://github.com/micrometre/ansible-kvm
#
# Examples:
#   # Configure KVM & remote management on host:
#   ansible-playbook ansible/playbooks/configure-kvm.yml --tags virtualization
#
#   # Create a VM:
#   ansible-playbook ansible/playbooks/configure-kvm.yml --tags vm -e "vm_name=git-server vm_static_ip=192.168.122.100"
#
#   # Check VM status / overview:
#   ansible-playbook ansible/playbooks/configure-kvm.yml --tags vm -e "vm_action=overview"
#   ansible-playbook ansible/playbooks/configure-kvm.yml --tags vm -e "vm_action=status vm_name=git-server"
#
#   # Manage snapshots:
#   ansible-playbook ansible/playbooks/configure-kvm.yml --tags vm -e "vm_action=snapshot_create vm_name=git-server snapshot_name=clean-install"

- name: Configure KVM Virtualization and Manage VMs
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  roles:
    - role: virtualization
      tags:
        - virtualization
        - setup

    - role: vm-manager
      tags:
        - vm
        - create-vm
        - snapshot
