---
# =============================================================================
# Turnkey Playbook: Launch Multipass VM & Provision with Ansible
# =============================================================================
# 1. Launches an Ubuntu VM via Multipass on localhost
# 2. Injects SSH authorized keys into the VM
# 3. Dynamically adds VM to in-memory inventory
# 4. Executes roles (common, docker, git_server) on the newly created VM

- name: Launch and Prepare Multipass VM
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    vm_name: "git-server"
    vm_image: "noble"
    vm_cpus: 2
    vm_memory: "4G"
    vm_disk: "20G"

  tasks:
    - name: Verify multipass CLI is available
      ansible.builtin.command: which multipass
      register: multipass_check
      changed_when: false
      failed_when: multipass_check.rc != 0

    - name: Check VM status
      ansible.builtin.command: "multipass info {{ vm_name }}"
      register: vm_info_raw
      changed_when: false
      failed_when: false

    - name: Launch Multipass VM if not running
      ansible.builtin.command: >
        multipass launch {{ vm_image }}
        --name {{ vm_name }}
        --cpus {{ vm_cpus }}
        --memory {{ vm_memory }}
        --disk {{ vm_disk }}
      when: vm_info_raw.rc != 0
      register: vm_launch_result
      changed_when: true

    - name: Ensure VM is started
      ansible.builtin.command: "multipass start {{ vm_name }}"
      when: vm_info_raw.rc == 0 and 'Running' not in vm_info_raw.stdout
      register: vm_start_result
      changed_when: true

    - name: Retrieve VM IPv4 address
      ansible.builtin.shell: >
        multipass info {{ vm_name }} | awk '/IPv4:/ {print $2}' | head -n1
      register: vm_ip_raw
      changed_when: false

    - name: Set VM IP fact
      ansible.builtin.set_fact:
        vm_ip: "{{ vm_ip_raw.stdout | trim }}"

    - name: Inject host SSH public key into VM
      ansible.builtin.shell: >
        multipass exec {{ vm_name }} -- mkdir -p .ssh &&
        cat ~/.ssh/*.pub 2>/dev/null | multipass exec {{ vm_name }} -- tee -a .ssh/authorized_keys >/dev/null &&
        multipass exec {{ vm_name }} -- chmod 600 .ssh/authorized_keys
      changed_when: true
      failed_when: false

    - name: Add Multipass VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: git_servers
        ansible_host: "{{ vm_ip }}"
        ansible_user: ubuntu
        forgejo_domain: "{{ vm_ip }}"

    - name: Wait for SSH to become available on VM
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        delay: 2
        timeout: 60
        state: started

- name: Provision Infrastructure on Multipass VM
  hosts: git_servers
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, baseline]

    - role: docker
      tags: [docker]

    - role: git_server
      tags: [git_server, app]
