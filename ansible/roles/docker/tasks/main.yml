---
- name: Check if Docker and Docker Compose are already installed
  ansible.builtin.shell: command -v docker && docker compose version && docker buildx version
  register: existing_docker_check
  changed_when: false
  failed_when: false

- name: Install Docker and Compose plugin if not already present
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  when: existing_docker_check.rc != 0

- name: Add deployment user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Reset SSH connection to apply docker group membership
  ansible.builtin.meta: reset_connection

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"

- name: Verify Docker is functional
  ansible.builtin.command: docker info
  register: docker_info_result
  changed_when: false

- name: Verify Docker Compose is functional
  ansible.builtin.command: docker compose version
  register: compose_version_result
  changed_when: false

- name: Verify Docker Buildx is functional
  ansible.builtin.command: docker buildx version
  register: buildx_version_result
  changed_when: false
