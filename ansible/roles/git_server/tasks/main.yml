---
- name: Ensure git-server project directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  loop:
    - "{{ git_server_dir }}"
    - "{{ git_server_dir }}/data"
    - "{{ git_server_dir }}/data/forgejo"
    - "{{ git_server_dir }}/data/postgres"
    - "{{ git_server_dir }}/scripts"
    - "{{ backup_dir }}"

- name: Render .env configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ git_server_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ git_server_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Copy restore helper script to target server
  ansible.builtin.copy:
    src: restore-forgejo.sh
    dest: "{{ git_server_dir }}/scripts/restore-forgejo.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Start Forgejo and PostgreSQL services
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ git_server_dir }}"
  become_user: "{{ deploy_user }}"
  register: compose_up_result
  changed_when: "'Started' in compose_up_result.stdout or 'Created' in compose_up_result.stdout"

- name: Wait for Forgejo web port to respond
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ forgejo_http_port }}"
    delay: 3
    timeout: 60
    state: started

- name: Configure Host git.vm SSH alias on controller for Git over SSH (port {{ forgejo_ssh_port }})
  ansible.builtin.blockinfile:
    path: "/home/{{ deploy_user }}/.ssh/config"
    create: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: git.vm"
    block: |
      Host git.vm
          HostName {{ '127.0.0.1' if (ansible_connection | default('') == 'local') else ansible_host }}
          Port {{ forgejo_ssh_port }}
          User git
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
  delegate_to: localhost
  become: false

- name: Check if administrator account exists
  ansible.builtin.command:
    cmd: >
      docker compose exec -T db psql -U {{ postgres_user }} -d {{ postgres_db }}
      -tAc "SELECT COUNT(*) FROM \"user\";"
    chdir: "{{ git_server_dir }}"
  become_user: "{{ deploy_user }}"
  register: user_count_check
  changed_when: false
  failed_when: false

- name: Create initial administrator account if no users exist
  ansible.builtin.command:
    cmd: >
      docker compose exec --user git server forgejo admin user create
      --admin
      --username {{ admin_user }}
      --password {{ admin_password }}
      --email {{ admin_email }}
      --must-change-password=false
    chdir: "{{ git_server_dir }}"
  become_user: "{{ deploy_user }}"
  when: user_count_check.rc == 0 and (user_count_check.stdout | trim) == "0"
  register: create_admin_result
  changed_when: true

- name: Handle optional backup restore if specified
  when: git_server_restore_file is defined and git_server_restore_file != ""
  block:
    - name: Ensure target backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Copy backup archive to target host
      ansible.builtin.copy:
        src: "{{ git_server_restore_file }}"
        dest: "{{ backup_dir }}/restore-target.zip"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Execute restore inside target host
      ansible.builtin.command:
        cmd: "{{ git_server_dir }}/scripts/restore-forgejo.sh {{ backup_dir }}/restore-target.zip"
        chdir: "{{ git_server_dir }}"
      become_user: "{{ deploy_user }}"
      register: restore_result
      changed_when: true

    - name: Update restored app.ini domain and root URL to match current host IP
      ansible.builtin.replace:
        path: "{{ git_server_dir }}/data/forgejo/gitea/conf/app.ini"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '^(DOMAIN\s*=\s*).*$', replace: '\g<1>{{ forgejo_domain }}' }
        - { regexp: '^(SSH_DOMAIN\s*=\s*).*$', replace: '\g<1>{{ forgejo_domain }}' }
        - { regexp: '^(ROOT_URL\s*=\s*).*$', replace: '\g<1>{{ forgejo_root_url }}' }
      failed_when: false

    - name: Restart Forgejo server after updating restored app.ini
      ansible.builtin.command:
        cmd: docker compose restart server
        chdir: "{{ git_server_dir }}"
      become_user: "{{ deploy_user }}"
      changed_when: true
