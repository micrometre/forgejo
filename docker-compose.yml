networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-16}
    container_name: forgejo
    restart: always
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      # Database settings (PostgreSQL)
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=${POSTGRES_DB:-forgejo}
      - FORGEJO__database__USER=${POSTGRES_USER:-forgejo}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD:-forgejo}
      # Server URLs and SSH port display
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN:-localhost}
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL:-http://localhost:3000/}
      - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-222}
      - FORGEJO__server__SSH_LISTEN_PORT=22
      # Mark installation as complete so CLI commands work and web wizard is bypassed
      - FORGEJO__security__INSTALL_LOCK=true
      # Forgejo Actions (GitHub Actions compatible workflows)
      - FORGEJO__actions__ENABLED=${FORGEJO_ACTIONS_ENABLED:-true}
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=${FORGEJO_ACTIONS_URL:-https://github.com}
    networks:
      - forgejo
    volumes:
      - ./data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_HTTP_PORT:-3000}:3000"
      - "${FORGEJO_SSH_PORT:-222}:22"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: forgejo-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-forgejo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-forgejo}
      - POSTGRES_DB=${POSTGRES_DB:-forgejo}
    networks:
      - forgejo
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgejo} -d ${POSTGRES_DB:-forgejo}"]
      interval: 5s
      timeout: 5s
      retries: 5
