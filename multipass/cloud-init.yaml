#cloud-config
# Cloud-init configuration for Multipass Forgejo Git Server VM
package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2
  - make
  - git
  - curl
  - jq
  - unzip

groups:
  - docker

users:
  - default
  - name: ubuntu
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now docker
  - mkdir -p /home/ubuntu/forgejo-backups
  - chown -R ubuntu:ubuntu /home/ubuntu
